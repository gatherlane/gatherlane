# SPDX-License-Identifier: Apache-2.0
# nginx for running Gatherlane on your own machine. compose.yaml mounts it as
# /etc/nginx/nginx.conf. It serves app/ as static files and nothing else, with the same response
# headers that app/_headers gives Cloudflare Pages. tests/test_docker.py fails if the add_header
# lines below and app/_headers drift apart, so change both together.
#
# This is the whole nginx.conf, not a conf.d snippet, so nothing in the image's own nginx.conf
# (worker count, log paths, temp paths, extra includes) changes underneath it on an image bump.

# One worker is plenty for one person on loopback. "auto" would start one per host CPU, each with
# its own memory, whatever the container's CPU limit says.
worker_processes 1;
error_log /dev/stderr notice;
# The root filesystem is read-only: /tmp, a tmpfs, is the only writable path in the container.
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The healthcheck in compose.yaml names itself, so it does not fill `docker compose logs`.
    map $http_user_agent $loggable {
        "gatherlane-healthcheck" 0;
        default                  1;
    }
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout main if=$loggable;

    sendfile          on;
    keepalive_timeout 65;
    # No nginx version in the Server header or on error pages.
    server_tokens     off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        # A redirect (for example /js to /js/) keeps whatever host port compose.yaml published,
        # instead of naming the container's own 8080.
        absolute_redirect off;
        # Answer a Range request with the whole file. The office has nothing worth resuming, and
        # without this a range past the end gets a 416, on which nginx sends every header twice.
        max_ranges 0;

        # The headers from app/_headers, rule "/*". `always` sends them on error responses too.
        # They are set here and in no location block: a location with any add_header of its own
        # would silently drop every one of these from its responses.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Pages reads _headers and does not serve it, so neither does this. ~* folds ASCII letters
        # only, which covers /_HEADERS, the same file through the case-insensitive bind mount on a
        # Mac.
        location ~* ^/_headers$ {
            return 404;
        }

        # No path with a byte outside ASCII. The Mac bind mount also folds Unicode case and
        # normalisation, which ~* does not: /_header%C5%BF (U+017F, long s, folds to s) opens
        # _headers there. app/ has no file with a non-ASCII name (tests/test_docker.py checks), so
        # this refuses nothing real. Not (*UTF): a URI that is not valid UTF-8 would then be a 500.
        location ~ "[\x80-\xFF]" {
            return 404;
        }

        # No dotfiles. app/ has none in git, but a working copy can (.DS_Store on a Mac, an
        # editor's swap file), and nothing outside the tracked site should be served.
        location ~ /\. {
            return 404;
        }
    }
}
